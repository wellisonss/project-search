services:
meilisearch:
image: getmeili/meilisearch:v1.10
environment:
MEILI_ENV: production
MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
volumes:
- meili-data:/meili_data
networks:
- project-search-net
deploy:
replicas: 1
restart_policy:
condition: on-failure
healthcheck:
test:
- CMD
- wget
- -qO-
- http://localhost:7700/health
interval: 15s
timeout: 5s
retries: 5
start_period: 10s

api:
image: project-search-api:latest
ports:
- "3336:3336"
environment:
PORT: 3336
MEILISEARCH_HOST: http://meilisearch:7700
MEILISEARCH_KEY: ${MEILI_MASTER_KEY}
GEMINI_API_KEY: ${GEMINI_API_KEY:-}
PROJECT_SEARCH_SECRET: ${PROJECT_SEARCH_SECRET:-}
API_PRINCIPAL_URL: ${API_PRINCIPAL_URL}
PROJECT_SEARCH_PRICE_LIST_IDS: ${PROJECT_SEARCH_PRICE_LIST_IDS:-5000088,5000089}
volumes:
- api-data:/app/data
networks:
- project-search-net
deploy:
replicas: 1
restart_policy:
condition: on-failure
healthcheck:
test:
- CMD
- wget
- -qO-
- http://localhost:3336/products/config
interval: 15s
timeout: 5s
retries: 5
start_period: 10s

networks:
project-search-net:
driver: overlay
attachable: true

volumes:
meili-data:
api-data:
